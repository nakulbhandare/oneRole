  <script>
    // Serve this page from an origin listed in ALLOWED_ORIGINS; browser sign-in also needs the API hostname.
    function defaultApiBase() {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return 'http://localhost:8080/api/v1';
      const localHost = ['localhost', '127.0.0.1'].includes(location.hostname.toLowerCase());
      if (localHost && location.port === '3000') {
        const apiHost = location.hostname.toLowerCase() === '127.0.0.1' ? '127.0.0.1' : 'localhost';
        return location.protocol + '//' + apiHost + ':8080/api/v1';
      }
      return location.origin + '/api/v1';
    }
    const API_BASE = new URL(window.ONE_ROLE_API_BASE || defaultApiBase(), location.href).toString().replace(/\/$/, '');
    const API_URL = new URL(API_BASE);
    const API_ORIGIN = API_URL.origin;
    const sessionHostMatchesAPI = location.protocol === API_URL.protocol && location.hostname.toLowerCase() === API_URL.hostname.toLowerCase();
    const isUUID = (value) => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
    // A server may inject these IDs after the user has selected a reviewed resume and stored consent.
    const APPLICATION_CONTEXT = window.ONE_ROLE_APPLICATION_CONTEXT || {};
    const applicationContextReady = isUUID(APPLICATION_CONTEXT.resume_version_id) && isUUID(APPLICATION_CONTEXT.consent_id);
    const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const viewsWithSearch = new Set(['Discover Jobs', 'New Jobs']);
    const statusLabels = {
      preparing: 'Preparing for review', needs_user_input: 'Needs your input', ready_for_review: 'Ready for your review',
      approved: 'Approved', queued: 'Queued by OneRole', submitting: 'Submission in progress', submitted: 'Employer confirmed receipt',
      submission_unconfirmed: 'Submission unconfirmed', requires_manual_action: 'Manual action required', failed_retryable: 'Paused for retry',
      failed_permanent: 'Could not continue', duplicate: 'Already in progress', expired: 'Expired', skipped: 'Skipped', rejected_by_user: 'Stopped by you'
    };
    let activeView = 'Discover Jobs';
    let activeTab = 'For you';
    let jobs = [];
    let selectedJob = null;
    let providers = [];
    let currentUser = null;
    let selectedTenantID = '';
    let accessToken = '';
    let csrfToken = '';
    let applications = [];
    let searchTerm = '';
    let locationTerm = '';
    let datePreset = 'any';
    let sortOrder = 'relevance';
    const emptyFilters = () => ({
      excludeTerms: [], locations: [], radiusKM: '', workplaceModes: [], companies: [], excludedCompanies: [],
      degreeLevels: [], degreeRequirement: 'any', maxExperienceYears: '', includeUnknownExperience: false,
      visaSponsorship: 'any', roleIDs: [], jobTypes: [], employmentTypes: [],
      includeUnknown: {location: false, company: false, degree: false, workplace: false, role: false, jobType: false, employmentType: false, publicationTime: false}
    });
    const cloneFilters = value => JSON.parse(JSON.stringify(value));
    let appliedFilters = emptyFilters();
    let filterDraft = emptyFilters();
    let filtersOpen = false;
    let metadataFacets = {};
    let searchFacets = {};
    let facetLoadError = '';
    let companySuggestions = {include: [], exclude: []};
    let locationSuggestions = [];
    let suggestionTimers = {};
    let suggestionSequence = {};
    let loadingJobs = false;
    let searchError = '';
    let apiError = '';
    let providersLoaded = false;
    let statusLoading = false;
    let searchSequence = 0;
    let mobileDetail = false;

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function apiURL(path) {
      if (/^https?:\/\//i.test(path)) return path;
      if (path.startsWith('/api/v1/')) return new URL(path, API_ORIGIN).toString();
      return new URL(path.replace(/^\/+/, ''), `${API_BASE}/`).toString();
    }

    function readCookie(name) {
      const prefix = `${name}=`;
      const item = document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix));
      return item ? decodeURIComponent(item.slice(prefix.length)) : '';
    }

    function readTenantSelection() {
      try { return sessionStorage.getItem('onerole_tenant_id') || ''; } catch (_error) { return ''; }
    }

    function storeTenantSelection(tenantID) {
      try {
        if (tenantID) sessionStorage.setItem('onerole_tenant_id', tenantID);
        else sessionStorage.removeItem('onerole_tenant_id');
      } catch (_error) { /* The active tenant remains in memory for this page. */ }
    }

    async function refreshAccessToken() {
      let csrf = sessionHostMatchesAPI ? readCookie('onerole_csrf') : '';
      if (!csrf) {
        let bootstrapResponse;
        try {
          bootstrapResponse = await fetch(apiURL('/auth/csrf'), {method: 'GET', credentials: 'include'});
        } catch (_error) {
          throw new Error('The CSRF session could not be reached. Check the API address, exact ALLOWED_ORIGINS entry, and same-site browser setup.');
        }
        const bootstrap = await bootstrapResponse.json().catch(() => ({}));
        if (!bootstrapResponse.ok || !bootstrap.csrf_token) {
          const error = new Error(bootstrapResponse.status === 401 ? 'No active OneRole session. Sign in with an enabled provider.' : 'The browser could not read the CSRF session. The UI and API must share a site; cross-site deployments are unsupported.');
          error.status = bootstrapResponse.status;
          throw error;
        }
        csrf = bootstrap.csrf_token;
      }
      csrfToken = csrf;
      const response = await fetch(apiURL('/auth/refresh'), {
        method: 'POST',
        credentials: 'include',
        headers: {'X-CSRF-Token': csrf}
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.access_token) {
        accessToken = '';
        throw new Error(response.status === 401 ? 'Your OneRole session has expired. Sign in again.' : 'The OneRole session could not be refreshed.');
      }
      accessToken = payload.access_token;
      return accessToken;
    }

    async function apiRequest(path, options = {}) {
      const {authenticated = true, tenant = false, retry = true, ...fetchOptions} = options;
      if (authenticated && !accessToken) await refreshAccessToken();
      const headers = new Headers(fetchOptions.headers || {});
      if (authenticated && accessToken) headers.set('Authorization', `Bearer ${accessToken}`);
      if (tenant && selectedTenantID) headers.set('X-Tenant-ID', selectedTenantID);
      if (fetchOptions.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
      let response;
      try {
        response = await fetch(apiURL(path), {...fetchOptions, headers, credentials: 'include'});
      } catch (_error) {
        throw new Error('OneRole API is unreachable. Check the configured API address and frontend origin.');
      }
      if (response.status === 401 && authenticated && retry) {
        accessToken = '';
        await refreshAccessToken();
        return apiRequest(path, {...options, retry: false});
      }
      const payload = response.status === 204 ? null : await response.json().catch(() => null);
      if (!response.ok) {
        const message = payload?.error?.message || `OneRole API returned ${response.status}.`;
        const error = new Error(message);
        error.status = response.status;
        error.payload = payload;
        throw error;
      }
      return payload;
    }

    async function loadProviders() {
      try {
        const payload = await apiRequest('/auth/providers', {authenticated: false});
        providers = Array.isArray(payload?.providers) ? payload.providers : [];
        providersLoaded = true;
        apiError = '';
      } catch (error) {
        apiError = error.message;
        providers = [];
        providersLoaded = false;
      }
    }

    function chooseTenant(memberships) {
      const ids = memberships.map(item => item.tenant_id).filter(isUUID);
      const saved = readTenantSelection();
      if (ids.includes(saved)) selectedTenantID = saved;
      else if (ids.length === 1) selectedTenantID = ids[0];
      else selectedTenantID = '';
      storeTenantSelection(selectedTenantID);
    }

    function updateIdentity() {
      const memberships = Array.isArray(currentUser?.memberships) ? currentUser.memberships : [];
      const name = currentUser?.display_name || 'Signed out';
      const initials = name.trim().split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase() || '?';
      document.getElementById('user-name').textContent = name;
      document.getElementById('user-email').textContent = currentUser?.email || (accessToken ? 'OneRole account' : 'Connect to OneRole');
      document.getElementById('user-avatar').textContent = initials;
      document.getElementById('top-avatar').textContent = initials;
      const control = document.getElementById('tenant-control');
      const select = document.getElementById('tenant-select');
      control.hidden = !accessToken || memberships.length < 2;
      if (memberships.length > 1) {
        select.innerHTML = memberships.filter(item => isUUID(item.tenant_id)).map(item => `<option value="${escapeHTML(item.tenant_id)}">${escapeHTML(item.label || item.name || item.tenant_id)}</option>`).join('');
        select.value = selectedTenantID;
      }
      const action = document.getElementById('session-action');
      action.textContent = accessToken ? 'Sign out' : 'Sign in';
      document.getElementById('source-summary').textContent = apiError ? 'API status unavailable' : accessToken ? 'API session active' : 'Sign-in required for live data';
    }

    function providerLinks() {
      const enabled = providers.filter(provider => provider.enabled);
      if (!providersLoaded) return apiError ? '' : '<span>Checking sign-in providers…</span>';
      if (!enabled.length) return '<span>No sign-in providers are enabled in this deployment.</span>';
      return `<div class="provider-list">${enabled.map(provider => `<a class="provider-link" href="${escapeHTML(apiURL(`/auth/oauth/${encodeURIComponent(provider.id)}/start`))}">${escapeHTML(provider.label)}</a>`).join('')}</div>`;
    }

    function authBanner() {
      if (accessToken) return '';
      if (apiError) return stateBanner('error', 'OneRole API is unavailable', `${apiError} No sample jobs are shown.`, '');
      const originNote = sessionHostMatchesAPI ? '' : 'Cross-origin browser sessions require a same-site UI/API deployment and the CSRF bootstrap route; cross-site deployments are unsupported.';
      return stateBanner('warning', 'Sign in to search live listings', `Job discovery requires a OneRole session. The application shows only records returned by the configured API. ${originNote}`, providerLinks());
    }

    function stateBanner(kind, title, copy, extra = '') {
      return `<div class="state-banner ${kind}">${icon(kind === 'error' ? 'close' : 'shield')}<div><strong>${escapeHTML(title)}</strong>${escapeHTML(copy)}${extra ? `<div>${extra}</div>` : ''}</div></div>`;
    }

    function formatDate(value) {
      if (!value) return 'Not provided';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Not provided' : date.toLocaleDateString(undefined, {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function timeAgo(value) {
      if (!value) return 'time not provided';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'time not provided';
      const minutes = Math.max(0, Math.floor((Date.now() - date.getTime()) / 60000));
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hr ago`;
      const days = Math.floor(hours / 24);
      return `${days} day${days === 1 ? '' : 's'} ago`;
    }

    function locationLabel(job) {
      if (job.location?.trim()) return job.location.trim();
      const parts = [job.city, job.region, job.country_code].filter(Boolean);
      return parts.length ? parts.join(', ') : 'Location not provided';
    }

    function humanize(value) {
      return String(value || '').replace(/_/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
    }

    function jobTags(job) {
      return [...(job.workplace_modes || []), ...(job.employment_types || []), ...(job.degree_levels || [])].filter(Boolean).slice(0, 4);
    }

    function capabilityLabel(job) {
      return humanize(job.application_capability || 'unknown');
    }

    function canStartApplication(job) {
      return ['automated_supported', 'assisted_supported'].includes(job.application_capability);
    }

    function applyAction(job) {
      if (job.application_capability === 'manual_required' && isHTTPURL(job.source_url)) {
        return `<a class="button primary" href="${escapeHTML(job.source_url)}" target="_blank" rel="noopener noreferrer">Open employer listing ${icon('arrow')}</a>`;

      const hasMembership = Array.isArray(currentUser?.memberships) && currentUser.memberships.length > 0;
      const label = !canStartApplication(job) ? 'Not supported' : !selectedTenantID ? (hasMembership ? 'Choose workspace' : 'Workspace required') : !applicationContextReady ? 'Setup required' : 'Prepare application';
      const title = !canStartApplication(job) ? `API capability: ${capabilityLabel(job)}.` : !selectedTenantID ? (hasMembership ? 'Select an active workspace before starting an application.' : 'Your account has no active workspace membership.') : !applicationContextReady ? 'A reviewed resume version and stored consent are required.' : 'Starts a review workflow in OneRole; does not submit to an employer.';

      const remote = (job.workplace_modes || []).includes('remote') ? '<span class="tag remote">Remote</span>' : '';
      const firstSeen = job.first_seen_at ? `First discovered ${escapeHTML(timeAgo(job.first_seen_at))}` : 'Discovery time not provided';
      return `<article class="job-card ${selected}" data-job="${escapeHTML(job.id)}" tabindex="0" aria-label="${escapeHTML(job.title)} at ${escapeHTML(job.company)}"><div class="job-card-top"><div class="company-logo">${escapeHTML((job.company || '?').trim().slice(0, 1).toUpperCase())}</div><div class="job-heading"><div class="job-title">${escapeHTML(job.title)}</div><div class="company-name">${escapeHTML(job.company)}</div></div><button class="save-btn" type="button" disabled title="Saved jobs are not available in the documented API." aria-label="Saved jobs are not available">${icon('bookmark')}</button></div><div class="job-meta"><span>${icon('pin')}${escapeHTML(locationLabel(job))}</span><span>${icon('clock')}${escapeHTML(humanize(job.job_type || job.employment_types?.[0] || 'Type not provided'))}</span></div><div class="job-tags"><span class="capability-tag">${escapeHTML(capabilityLabel(job))}</span>${remote}${tags}</div><div class="job-card-foot"><span class="seen"><i></i>${firstSeen}</span><div class="job-actions">${applyAction(job)}<button class="button" type="button" disabled title="Passing jobs is not available in the documented API.">Pass</button></div></div></article>`;
    }

    function isHTTPURL(value) {
      try { return ['http:', 'https:'].includes(new URL(value).protocol); } catch (_error) { return false; }
    }

    function detailHTML(job) {
      if (!job) return `<aside class="detail-panel"><div class="detail-main"><div class="list-empty">Select a live listing to inspect its details.</div></div></aside>`;
      const description = job.description?.trim() || 'The source did not provide a description.';
      const statusText = canStartApplication(job)
        ? 'OneRole can prepare a review workflow for this capability. Employer submission requires a separate authorization and readiness check.'
        : job.application_capability === 'manual_required'
          ? 'This listing requires you to continue directly with the employer. OneRole will not submit it automatically.'
          : `OneRole cannot start an application for this listing with capability “${capabilityLabel(job)}”.`;
      const sourceLink = isHTTPURL(job.source_url) ? `<a href="${escapeHTML(job.source_url)}" target="_blank" rel="noopener noreferrer" class="company-row">Open original employer listing ${icon('arrow')}</a>` : '<span class="source-note">Original listing URL is not available.</span>';

      return `<aside class="detail-panel ${mobileDetail ? 'mobile-open' : ''}" id="detail-panel"><div class="detail-cover"></div><div class="detail-main"><div class="detail-logo-row"><div class="detail-logo">${escapeHTML((job.company || '?').trim().slice(0, 1).toUpperCase())}</div><button class="mobile-close" id="mobile-close" aria-label="Close details">${icon('close')}</button><button class="detail-save" type="button" disabled title="Saved jobs are not available in the documented API.">${icon('bookmark')} Save unavailable</button></div><h2 class="detail-title">${escapeHTML(job.title)}</h2><div class="detail-company">${escapeHTML(job.company)}</div><div class="detail-facts"><span>${icon('pin')}${escapeHTML(locationLabel(job))}</span><span>${icon('briefcase')}${escapeHTML(types)}</span><span>${icon('clock')}${published}</span></div><div class="detail-actions">${applyAction(job)}<button class="button" type="button" disabled title="Passing jobs is not available in the documented API.">Pass unavailable</button></div><div class="job-status ${canStartApplication(job) ? '' : 'warning'}">${icon('shield')}${escapeHTML(statusText)}</div><section class="detail-section"><h3 class="section-title">About the role</h3><p class="detail-desc">${escapeHTML(description)}</p></section>${skills.length ? `<section class="detail-section"><h3 class="section-title">Normalized role and degree tags</h3><div class="skill-list">${skills.map(skill => `<span class="skill">${escapeHTML(humanize(skill))}</span>`).join('')}</div></section>` : ''}<section class="detail-section"><h3 class="section-title">Listing provenance</h3><p class="detail-desc">First seen ${escapeHTML(formatDate(job.first_seen_at))}; last seen ${escapeHTML(formatDate(job.last_seen_at))}. These values are returned by the API.</p></section>${sourceLink}</div></aside>`;
    }

    function datePayload() {
      if (activeView === 'New Jobs') {
        return {preset: 'any', first_seen_after: new Date(Date.now() - 7 * 86400000).toISOString()};
      }
      return {preset: datePreset};
    }

    const filterEnums = {
      workplace: [['remote', 'Remote'], ['hybrid', 'Hybrid'], ['on_site', 'On site']],
      degree_level: [['high_school', 'High school'], ['associate', 'Associate'], ['bachelor', 'Bachelor'], ['master', 'Master'], ['doctorate', 'Doctorate'], ['no_degree_stated', 'No degree stated'], ['unknown', 'Unknown tag']],
      degree_requirement: [['required', 'Required'], ['preferred', 'Preferred'], ['any', 'Any']],
      visa_sponsorship: [['yes', 'Yes'], ['no', 'No'], ['unknown', 'Unknown'], ['any', 'Any']],
      job_type: [['internship', 'Internship'], ['entry_level', 'Entry level'], ['associate', 'Associate'], ['mid_level', 'Mid level'], ['senior', 'Senior'], ['lead', 'Lead'], ['manager', 'Manager'], ['director', 'Director'], ['executive', 'Executive']],
      employment_type: [['full_time', 'Full time'], ['part_time', 'Part time'], ['contract', 'Contract'], ['temporary', 'Temporary'], ['seasonal', 'Seasonal'], ['freelance', 'Freelance'], ['internship', 'Internship'], ['apprenticeship', 'Apprenticeship'], ['other', 'Other']]
    };

    function facetFor(key) {
      return searchFacets[key] || metadataFacets[key] || null;
    }

    function facetCount(key, value) {
      const option = (facetFor(key)?.options || []).find(item => item.value === value);
      return option ? String(option.count) : '';
    }

    function unknownCountText(key) {
      const facet = facetFor(key);
      return facet && Number.isFinite(facet.unknown_count) ? 'Unknown count: ' + facet.unknown_count : 'Unknown count unavailable until the API responds.';
    }

    function unknownCheckbox(label, key, property, checked) {
      return '<label class="filter-unknown"><input type="checkbox" data-unknown-filter="' + property + '" ' + (checked ? 'checked' : '') + ' />' +
        escapeHTML(label) + ' (' + escapeHTML(unknownCountText(key)) + ')</label>';
    }

    function filterChoiceGroup(title, arrayName, facetKey, choices, selected, unknownProperty, unknownLabel) {
      const facetOptions = facetFor(facetKey)?.options || [];
      let available = choices.slice();
      if (!available.length && facetOptions.length) available = facetOptions.map(option => [option.value, option.label]);
      const rows = available.map(choice => {
        const value = choice[0];
        const facetOption = facetOptions.find(option => option.value === value);
        const label = facetOption?.label || choice[1];
        const count = facetCount(facetKey, value);
        return '<label class="filter-option"><input type="checkbox" data-filter-array="' + arrayName + '" value="' + escapeHTML(value) + '" ' +
          (selected.includes(value) ? 'checked' : '') + ' /><span>' + escapeHTML(label) + '</span>' +
          (count === '' ? '' : '<small>' + escapeHTML(count) + '</small>') + '</label>';
      }).join('');
      const unknown = unknownProperty ? unknownCheckbox(unknownLabel, facetKey, unknownProperty, filterDraft.includeUnknown[unknownProperty]) : '';
      return '<fieldset class="filter-block"><legend>' + escapeHTML(title) + '</legend><div class="filter-options">' + rows +
        '</div><div class="facet-unknown">' + escapeHTML(unknownCountText(facetKey)) + '</div>' + unknown + '</fieldset>';
    }

    function filterSelect(title, inputID, facetKey, choices, selected) {
      const facetOptions = facetFor(facetKey)?.options || [];
      const options = choices.map(choice => {
        const value = choice[0];
        const facetOption = facetOptions.find(item => item.value === value);
        const label = facetOption?.label || choice[1];
        const count = facetCount(facetKey, value);
        return '<option value="' + escapeHTML(value) + '" ' + (selected === value ? 'selected' : '') + '>' +
          escapeHTML(label) + (count === '' ? '' : ' · ' + escapeHTML(count)) + '</option>';
      }).join('');
      return '<label class="filter-block"><span class="filter-block-title">' + escapeHTML(title) + '</span><select class="filter-select" id="' +
        inputID + '">' + options + '</select><div class="facet-unknown">' + escapeHTML(unknownCountText(facetKey)) + '</div></label>';
    }

    function companyChips(mode) {
      const property = mode === 'include' ? 'companies' : 'excludedCompanies';
      return filterDraft[property].map((company, index) => '<span class="filter-chip">' + escapeHTML(company.name) +
        '<button type="button" aria-label="Remove ' + escapeHTML(company.name) + '" data-remove-company="' + mode + '" data-index="' + index + '">×</button></span>').join('');
    }

    function locationChips() {
      return filterDraft.locations.map((place, index) => '<span class="filter-chip">' + escapeHTML(place.label) +
        '<button type="button" aria-label="Remove ' + escapeHTML(place.label) + '" data-remove-location="' + index + '">×</button></span>').join('');
    }

    function suggestionMarkup(kind, items) {
      if (!items.length) return '';
      return items.map((item, index) => {
        const label = kind === 'location' ? item.label + ' · ' + item.matching_job_count + ' matching' : item.name;
        return '<button type="button" class="suggestion" data-suggestion-kind="' + kind + '" data-index="' + index + '">' +
          escapeHTML(label) + '</button>';
      }).join('');
    }

    function filterPanelHTML() {
      const roleOptions = (facetFor('role')?.options || []).map(item => [item.value, item.label]);
      const roleSelected = filterDraft.roleIDs;
      const roleGroup = filterChoiceGroup('Role', 'roleIDs', 'role', roleOptions, roleSelected, 'role', 'Include unknown roles');
      return '<section class="filter-panel" id="filter-panel" aria-label="Job filters" ' + (filtersOpen ? '' : 'hidden') + '>' +
        '<div class="filter-panel-head"><div><h2>Filter live listings</h2><p>Counts and choices come from the authenticated API. Apply sends this filter set to job search.</p></div>' +
        '<button class="button" type="button" id="close-filters">Close</button></div>' +
        '<div class="filter-grid">' +
        '<label class="filter-block"><span class="filter-block-title">Exclude terms</span><input class="filter-input" id="exclude-terms" value="' + escapeHTML(filterDraft.excludeTerms.join(', ')) + '" placeholder="intern, junior" />' +
        '<p class="filter-help">Separate up to 30 excluded words or phrases with commas.</p></label>' +
        '<div class="filter-block"><h3>Location and radius</h3><input class="filter-input" id="filter-location-query" autocomplete="off" placeholder="Search a normalized city or region" />' +
        '<div class="filter-suggest" id="location-suggestions">' + suggestionMarkup('location', locationSuggestions) + '</div><div class="filter-chips">' + locationChips() + '</div>' +
        '<label class="filter-help" for="location-radius">Radius in kilometers (0 means exact location)</label><input class="filter-input" id="location-radius" type="number" min="0" max="500" value="' + escapeHTML(filterDraft.radiusKM) + '" />' +
        '<div class="facet-unknown">' + escapeHTML(unknownCountText('location')) + '</div>' + unknownCheckbox('Include listings without a known location', 'location', 'location', filterDraft.includeUnknown.location) + '</div>' +
        '<div class="filter-block"><h3>Companies to include</h3><input class="filter-input" id="company-include-query" autocomplete="off" placeholder="Search canonical companies" />' +
        '<div class="filter-suggest" id="company-include-suggestions">' + suggestionMarkup('include', companySuggestions.include) + '</div><div class="filter-chips">' + companyChips('include') + '</div>' +
        '<div class="facet-unknown">' + escapeHTML(unknownCountText('company')) + '</div>' + unknownCheckbox('Include listings without a company match', 'company', 'company', filterDraft.includeUnknown.company) + '</div>' +
        '<div class="filter-block"><h3>Companies to exclude</h3><input class="filter-input" id="company-exclude-query" autocomplete="off" placeholder="Search companies to omit" />' +
        '<div class="filter-suggest" id="company-exclude-suggestions">' + suggestionMarkup('exclude', companySuggestions.exclude) + '</div><div class="filter-chips">' + companyChips('exclude') + '</div>' +
        '<p class="filter-help">Both company lists use canonical company IDs returned by the API.</p></div>' +
        filterChoiceGroup('Workplace', 'workplaceModes', 'workplace', filterEnums.workplace, filterDraft.workplaceModes, 'workplace', 'Include unknown workplace') +
        filterChoiceGroup('Degree level', 'degreeLevels', 'degree_level', filterEnums.degree_level, filterDraft.degreeLevels, 'degree', 'Include unknown degree') +
        filterSelect('Degree requirement', 'degree-requirement', 'degree_requirement', filterEnums.degree_requirement, filterDraft.degreeRequirement) +
        '<label class="filter-block"><span class="filter-block-title">Maximum experience</span><input class="filter-input" id="max-experience" type="number" min="0" max="50" value="' +
        escapeHTML(filterDraft.maxExperienceYears) + '" placeholder="Any years" /><div class="facet-unknown">' + escapeHTML(unknownCountText('experience')) +
        '</div>' + unknownCheckbox('Include jobs with unknown experience', 'experience', 'experience', filterDraft.includeUnknownExperience) + '</label>' +
        filterSelect('Visa sponsorship', 'visa-sponsorship', 'visa_sponsorship', filterEnums.visa_sponsorship, filterDraft.visaSponsorship) +
        roleGroup +
        '<label class="filter-block"><span class="filter-block-title">Additional role IDs</span><input class="filter-input" id="role-ids" value="' +
        escapeHTML(filterDraft.roleIDs.join(', ')) + '" placeholder="platform_engineering" /><p class="filter-help">Use API facet values or comma-separated role taxonomy IDs.</p></label>' +
        filterChoiceGroup('Job type', 'jobTypes', 'job_type', filterEnums.job_type, filterDraft.jobTypes, 'jobType', 'Include unknown job type') +
        filterChoiceGroup('Employment type', 'employmentTypes', 'employment_type', filterEnums.employment_type, filterDraft.employmentTypes, 'employmentType', 'Include unknown employment type') +
        '<div class="filter-block"><h3>Publication date</h3><div class="facet-unknown">' + escapeHTML(unknownCountText('date')) + '</div>' +
        unknownCheckbox('Include listings with unknown publication time', 'date', 'publicationTime', filterDraft.includeUnknown.publicationTime) + '</div>' +
        '</div><div class="filter-panel-actions"><span class="filter-error" id="filter-error">' + escapeHTML(facetLoadError) + '</span>' +
        '<button class="button" type="button" id="refresh-filter-counts" ' + (!accessToken ? 'disabled' : '') + '>Refresh counts</button>' +
        '<span class="filter-spacer"></span><button class="button" type="button" id="clear-filters">Clear all</button>' +
        '<button class="button primary" type="button" id="apply-filters" ' + (!accessToken ? 'disabled title="Sign in before applying filters."' : '') + '>Apply filters</button></div></section>';
    }

    function readFilterDraftFromDOM() {
      const readValues = name => Array.from(document.querySelectorAll('[data-filter-array="' + name + '"]:checked')).map(input => input.value);
      filterDraft.excludeTerms = (document.getElementById('exclude-terms')?.value || '').split(/[\n,]/).map(value => value.trim()).filter(Boolean);
      filterDraft.workplaceModes = readValues('workplaceModes');
      filterDraft.degreeLevels = readValues('degreeLevels');
      filterDraft.roleIDs = readValues('roleIDs').concat((document.getElementById('role-ids')?.value || '').split(/[\n,]/).map(value => value.trim()).filter(Boolean));
      filterDraft.jobTypes = readValues('jobTypes');
      filterDraft.employmentTypes = readValues('employmentTypes');
      filterDraft.degreeRequirement = document.getElementById('degree-requirement')?.value || 'any';
      filterDraft.visaSponsorship = document.getElementById('visa-sponsorship')?.value || 'any';
      filterDraft.maxExperienceYears = document.getElementById('max-experience')?.value || '';
      filterDraft.radiusKM = document.getElementById('location-radius')?.value || '';
      filterDraft.includeUnknownExperience = document.querySelector('[data-unknown-filter="experience"]')?.checked || false;
      ['location', 'company', 'degree', 'workplace', 'role', 'jobType', 'employmentType', 'publicationTime'].forEach(key => {
        const input = document.querySelector('[data-unknown-filter="' + key + '"]');
        filterDraft.includeUnknown[key] = Boolean(input?.checked);
      });
      filterDraft.roleIDs = Array.from(new Set(filterDraft.roleIDs));
      return filterDraft;
    }

    function buildSearchPayload(filters, cursor = null) {
      const body = {
        query: searchTerm.trim(), sort: sortOrder, limit: 25,
        exclude_terms: filters.excludeTerms,
        workplace_modes: filters.workplaceModes,
        company_ids: filters.companies.map(company => company.id),
        excluded_company_ids: filters.excludedCompanies.map(company => company.id),
        degree_levels: filters.degreeLevels,
        degree_requirement: filters.degreeRequirement,
        visa_sponsorship: filters.visaSponsorship,
        role_ids: filters.roleIDs,
        job_types: filters.jobTypes,
        employment_types: filters.employmentTypes,
        include_unknown_location: filters.includeUnknown.location,
        include_unknown_company: filters.includeUnknown.company,
        include_unknown_degree: filters.includeUnknown.degree,
        include_unknown_workplace: filters.includeUnknown.workplace,
        include_unknown_role: filters.includeUnknown.role,
        include_unknown_job_type: filters.includeUnknown.jobType,
        include_unknown_employment_type: filters.includeUnknown.employmentType,
        include_unknown_experience: filters.includeUnknownExperience,
        date: Object.assign(datePayload(), {include_unknown_publication_time: filters.includeUnknown.publicationTime})
      };
      if (filters.maxExperienceYears !== '' && Number.isFinite(Number(filters.maxExperienceYears))) body.max_experience_years = Number(filters.maxExperienceYears);
      if (filters.locations.length) {
        body.locations = filters.locations.map(place => {
          const location = {location_id: place.id};
          if (filters.radiusKM !== '' && Number(filters.radiusKM) > 0) location.radius_km = Number(filters.radiusKM);
          return location;
        });
      } else if (locationTerm.trim()) {
        body.locations = [{city: locationTerm.trim()}];
      }
      if (cursor) body.cursor = cursor;
      return body;
    }

    async function loadFilterMetadata() {
      if (!accessToken) return;
      try {
        const payload = await apiRequest('/jobs/filters');
        metadataFacets = payload?.facets || {};
        facetLoadError = '';
      } catch (error) {
        facetLoadError = error.message;
      }
      if (filtersOpen) {
        readFilterDraftFromDOM();
        render();
      }
    }

    async function refreshDraftFacets() {
      if (!accessToken) return;
      readFilterDraftFromDOM();
      try {
        const payload = await apiRequest('/jobs/filters', {method: 'POST', body: JSON.stringify(buildSearchPayload(filterDraft))});
        searchFacets = payload || {};
        facetLoadError = '';
      } catch (error) {
        facetLoadError = error.message;
      }
      if (filtersOpen) render();
    }

    async function loadSuggestions(kind, query) {
      const sequence = (suggestionSequence[kind] || 0) + 1;
      suggestionSequence[kind] = sequence;
      if (!accessToken || query.trim().length < 2) {
        if (kind === 'location') locationSuggestions = [];
        else companySuggestions[kind] = [];
        const target = document.getElementById(kind === 'location' ? 'location-suggestions' : 'company-' + kind + '-suggestions');
        if (target) target.innerHTML = '';
        return;
      }
      const route = kind === 'location' ? '/locations/suggest?q=' : '/companies/search?q=';
      try {
        const payload = await apiRequest(route + encodeURIComponent(query.trim()) + '&limit=8');
        if (sequence !== suggestionSequence[kind]) return;
        if (kind === 'location') locationSuggestions = Array.isArray(payload?.items) ? payload.items : [];
        else companySuggestions[kind] = Array.isArray(payload?.items) ? payload.items : [];
        const target = document.getElementById(kind === 'location' ? 'location-suggestions' : 'company-' + kind + '-suggestions');
        if (target) target.innerHTML = suggestionMarkup(kind, kind === 'location' ? locationSuggestions : companySuggestions[kind]);
        bindSuggestionEvents();
      } catch (error) {
        facetLoadError = error.message;
        const target = document.getElementById(kind === 'location' ? 'location-suggestions' : 'company-' + kind + '-suggestions');
        if (target) target.textContent = 'Suggestions are unavailable: ' + error.message;
      }
    }

    function scheduleSuggestions(kind, query) {
      clearTimeout(suggestionTimers[kind]);
      suggestionTimers[kind] = setTimeout(() => loadSuggestions(kind, query), 250);
    }

    function bindSuggestionEvents() {
      document.querySelectorAll('.suggestion').forEach(button => {
        button.onclick = () => {
          readFilterDraftFromDOM();
          const kind = button.dataset.suggestionKind;
          const index = Number(button.dataset.index);
          if (kind === 'location') {
            const place = locationSuggestions[index];
            if (!place || filterDraft.locations.some(item => item.id === place.id)) return;
            if (filterDraft.locations.length >= 10) {
              toast('The API supports up to 10 selected locations.');
              return;
            }
            filterDraft.locations.push({id: place.id, label: place.label, city: place.city, region: place.region, country_code: place.country_code});
            locationSuggestions = [];
          } else {
            const company = companySuggestions[kind]?.[index];
            if (!company) return;
            const property = kind === 'include' ? 'companies' : 'excludedCompanies';
            if (filterDraft[property].length >= 100) {
              toast('The API supports up to 100 companies in each list.');
              return;
            }
            if (!filterDraft[property].some(item => item.id === company.id)) filterDraft[property].push({id: company.id, name: company.name});
            const otherProperty = kind === 'include' ? 'excludedCompanies' : 'companies';
            filterDraft[otherProperty] = filterDraft[otherProperty].filter(item => item.id !== company.id);
            companySuggestions[kind] = [];
          }
          render();
        };
      });
    }

    function searchPayload(cursor = null) {
      return buildSearchPayload(appliedFilters, cursor);
    }

    async function loadJobs() {
      if (!accessToken) {
        jobs = [];
        selectedJob = null;
        searchError = '';
        render();
        return;
      }
      const sequence = ++searchSequence;
      loadingJobs = true;
      searchError = '';
      render();
      try {
        const payload = await apiRequest('/jobs/search', {method: 'POST', body: JSON.stringify(searchPayload())});
        if (sequence !== searchSequence) return;
        jobs = Array.isArray(payload?.items) ? payload.items : [];
        searchFacets = payload?.facets || {};
        selectedJob = jobs.find(job => job.id === selectedJob?.id) || jobs[0] || null;
      } catch (error) {
        if (sequence !== searchSequence) return;
        jobs = [];
        selectedJob = null;
        searchError = error.message;
      } finally {
        if (sequence === searchSequence) {
          loadingJobs = false;
          render();
        }
      }
    }

    async function createApplication(jobID) {
      const job = jobs.find(item => item.id === jobID);
      if (!job || !canStartApplication(job) || !applicationContextReady || !selectedTenantID) return;
      const idempotencyKey = crypto.randomUUID();
      try {
        const accepted = await apiRequest('/applications', {
          method: 'POST', tenant: true,
          headers: {'Idempotency-Key': idempotencyKey},
          body: JSON.stringify({job_id: job.id, resume_version_id: APPLICATION_CONTEXT.resume_version_id, consent_id: APPLICATION_CONTEXT.consent_id, mode: 'review_before_submit'})
        });
        applications.unshift({id: accepted.workflow_id, job_id: job.id, status_url: accepted.status_url, status: accepted.status, message: accepted.message || 'Accepted by OneRole; employer submission is not yet confirmed.'});
        activeView = 'My Applications';
        render();
        toast('OneRole accepted a review workflow. The employer has not been contacted.');
        refreshApplicationStatuses();
      } catch (error) {
        toast(error.message);
      }
    }

    async function refreshApplicationStatuses() {
      if (statusLoading || !accessToken || !selectedTenantID || !applications.length) return;
      statusLoading = true;
      try {
        await Promise.all(applications.map(async item => {
          const path = item.status_url || `/api/v1/applications/${item.id}`;
          try {
            const current = await apiRequest(path, {tenant: true});
            item.status = current.status || item.status;
            item.pause_reason = current.pause_reason || '';
            item.capability = current.capability || '';
            item.updated_at = current.updated_at || '';
          } catch (error) {
            item.read_error = error.message;
          }
        }));
      } finally {
        statusLoading = false;
        if (activeView === 'My Applications') render();
      }
    }

    function activeFilterCount() {
      return appliedFilters.excludeTerms.length + appliedFilters.locations.length + appliedFilters.workplaceModes.length +
        appliedFilters.companies.length + appliedFilters.excludedCompanies.length + appliedFilters.degreeLevels.length +
        appliedFilters.roleIDs.length + appliedFilters.jobTypes.length + appliedFilters.employmentTypes.length +
        (appliedFilters.maxExperienceYears === '' ? 0 : 1) +
        (appliedFilters.degreeRequirement === 'any' ? 0 : 1) + (appliedFilters.visaSponsorship === 'any' ? 0 : 1) +
        Object.values(appliedFilters.includeUnknown).filter(Boolean).length + (appliedFilters.includeUnknownExperience ? 1 : 0);
    }

    function pageHeader(title, subtitle) {
      const dateControl = activeView === 'Discover Jobs' ? `<select class="select" id="date-window" aria-label="Publication date window"><option value="any" ${datePreset === 'any' ? 'selected' : ''}>Any publication date</option><option value="last_6_hours" ${datePreset === 'last_6_hours' ? 'selected' : ''}>Last 6 hours</option><option value="last_24_hours" ${datePreset === 'last_24_hours' ? 'selected' : ''}>Last 24 hours</option><option value="last_7_days" ${datePreset === 'last_7_days' ? 'selected' : ''}>Last 7 days</option><option value="last_30_days" ${datePreset === 'last_30_days' ? 'selected' : ''}>Last 30 days</option><option value="last_60_days" ${datePreset === 'last_60_days' ? 'selected' : ''}>Last 60 days</option></select>` : '';
      const filters = viewsWithSearch.has(activeView) ? `<div class="head-actions">${dateControl}<button class="button" id="filter-button" type="button" aria-expanded="${filtersOpen}">${icon('sliders')} Filters${activeFilterCount() ? ' · ' + activeFilterCount() : ''}</button></div>` : '';
      return `<div class="page-head"><div><div class="eyebrow">${title === 'Discover Jobs' ? 'Your next chapter' : 'OneRole workspace'}</div><h1 class="page-title">${escapeHTML(title)}</h1><p class="page-subtitle">${escapeHTML(subtitle)}</p></div>${filters}</div>`;
    }

    function discoveryPage() {
      const title = activeView === 'Discover Jobs' ? 'Discover Jobs' : 'New Jobs';
      const subtitle = activeView === 'Discover Jobs' ? 'Search listings returned by the configured OneRole API.' : 'Listings first seen by OneRole in the last seven days.';
      const list = jobs;
      const resultState = searchError
        ? stateBanner('error', 'Search could not be completed', searchError)
        : loadingJobs
          ? '<div class="job-state"><strong>Searching live listings…</strong>Waiting for the configured API.</div>'
          : !accessToken
            ? '<div class="job-state"><strong>Sign in to search</strong>Job listings are not shown until the API returns them for your session.</div>'
            : list.length
              ? list.map(jobCard).join('')
              : '<div class="job-state"><strong>No listings returned</strong>The API returned no jobs for these filters. Try a broader search or check configured source coverage.</div>';
      return `${pageHeader(title, subtitle)}${authBanner()}<div class="search-panel"><label class="search-field">${icon('search')}<input id="role-query" value="${escapeHTML(searchTerm)}" placeholder="Job title, company, or skill" /></label><label class="search-field">${icon('pin')}<input id="location-query" value="${escapeHTML(locationTerm)}" placeholder="City name" /></label><button class="button primary search-submit" id="search-submit" type="button">Search jobs</button></div><div class="tabs-row"><button class="tab ${activeView === 'Discover Jobs' ? 'active' : ''}" data-view="Discover Jobs">All listings</button><button class="tab ${activeView === 'New Jobs' ? 'active' : ''}" data-view="New Jobs">Recently discovered</button><button class="tab" data-view="Saved Jobs">Saved</button><div class="tab-end">API results · ${list.length} on this page</div></div><div class="results-layout"><div class="results-column"><div class="results-head"><div class="results-count"><strong>${list.length} listings</strong> returned${loadingJobs ? ' · loading' : ''}</div><button class="sort" id="sort-button" type="button">Sort: ${escapeHTML(humanize(sortOrder))}⌄</button></div><div class="job-list">${resultState}</div><div class="below-grid"><section class="mini-panel"><div class="mini-head"><h3>Source status</h3><button class="text-link" data-view="Settings" type="button">View details</button></div><p class="alert-body">The documented API does not expose source health or coverage. Listing cards show only records returned by search.</p></section><section class="mini-panel"><div class="mini-head"><h3>Application workflow</h3>${icon('shield')}</div><p class="alert-body">A review workflow is accepted by OneRole only when a supported capability, active workspace, resume version, and stored consent are available.</p></section></div></div>${detailHTML(selectedJob)}</div>`;
    }

    function applicationsPage() {
      const rows = applications.map(item => {
        const job = jobs.find(candidate => candidate.id === item.job_id);
        const status = item.status || 'accepted';
        const title = job ? `${job.title} · ${job.company}` : `Application ${item.id}`;
        const label = statusLabels[status] || humanize(status);
        const copy = status === 'submitted' ? 'The API reports employer confirmation.' : status === 'submission_unconfirmed' ? 'The employer result is ambiguous. Check the employer before taking another action.' : status === 'ready_for_review' ? 'The workflow is ready for review. Packet preview and submit authorization are not available in this UI.' : status === 'approved' ? 'Approval is recorded; employer submission is not confirmed.' : status === 'queued' || status === 'submitting' ? 'OneRole is processing the workflow; employer confirmation is pending.' : item.message || 'Accepted by OneRole; employer submission is not confirmed.';
        return `<div class="app-row"><div class="company-logo">${escapeHTML(job ? (job.company || '?').slice(0, 1).toUpperCase() : 'A')}</div><div class="app-row-main"><b>${escapeHTML(title)}</b><span>${escapeHTML(copy)}${item.pause_reason ? ` · ${escapeHTML(item.pause_reason)}` : ''}${item.read_error ? ` · Status refresh unavailable: ${escapeHTML(item.read_error)}` : ''}</span></div><span class="status-pill ${status === 'submitted' ? 'applied' : 'preview'}">${escapeHTML(label)}</span></div>`;
      }).join('');
      const historyNote = '<div class="job-status warning">The documented API has no application-list endpoint. This tab can show workflows started during this browser session only.</div>';
      const content = applications.length ? `<div>${rows}</div>${statusLoading ? '<p class="alert-body">Refreshing application status…</p>' : ''}` : '<div class="list-empty"><strong>No workflows started in this tab</strong>Application history is not available from the documented API.</div>';
      return `${pageHeader('My Applications', 'Track OneRole workflows and employer-confirmed outcomes where available.')}<section class="alt-card application-tracker"><div class="mini-head"><h2>Application tracker</h2><button class="button" id="refresh-applications" type="button" ${!accessToken || !selectedTenantID ? 'disabled' : ''}>Refresh status</button></div>${historyNote}${content}<div class="submission-note"><strong>202 means accepted by OneRole.</strong> It does not mean the employer received or accepted an application. OneRole reports “Employer confirmed receipt” only when the API returns the submitted state.</div></section><section class="alt-card" style="margin-top:13px"><h2>Browse listings</h2><p>Search live listings and review each capability before starting a workflow.</p><button class="button primary" style="margin-top:13px" data-view="Discover Jobs" type="button">Back to Discover Jobs ${icon('chevron')}</button></section>`;
    }

    function unavailablePage(title, explanation) {
      return `${pageHeader(title, explanation)}${stateBanner('warning', `${title} is not available yet`, 'No placeholder profile, saved listing, alert, or submission data is displayed. This view needs a documented API route before it can show or change account data.')}<section class="alt-card"><h2>Available API behavior</h2><p>OneRole exposes authenticated job search, job details, OAuth session routes, and application workflow routes. This screen will become interactive when its API contract is added.</p><button class="button primary" style="margin-top:14px" data-view="Discover Jobs" type="button">Open Discover Jobs ${icon('chevron')}</button></section>`;
    }

    function settingsPage() {
      const providerText = providersLoaded ? `${providers.filter(item => item.enabled).length} sign-in provider(s) enabled` : apiError || 'Provider status has not loaded.';
      return `${pageHeader('Settings', 'Review the current API connection and enabled sign-in providers.')}<section class="alt-card"><h2>API connection</h2><p>${escapeHTML(API_BASE)}</p><div class="alt-items"><div class="alt-item"><b>Session</b><span>${accessToken ? 'Authenticated with a short-lived in-memory access token.' : 'No active OneRole session.'}</span></div><div class="alt-item"><b>Workspace</b><span>${selectedTenantID ? 'An active tenant is selected for tenant-owned workflows.' : 'No active workspace is selected.'}</span></div><div class="alt-item"><b>Sign-in providers</b><span>${escapeHTML(providerText)}</span></div></div></section><section class="alt-card"><h2>Browser session origin</h2><p>Use the same origin, or same-site subdomains with the exact frontend origin in ALLOWED_ORIGINS. Cross-site frontends are unsupported because refresh cookies use SameSite=Strict.</p></section><section class="alt-card"><h2>Live data and source coverage</h2><p>Job search uses API records only. Source connection and coverage details are not exposed by the current API contract.</p></section>`;
    }

    function autoApplyPage() {
      return `${pageHeader('Auto-apply', 'Automatic employer submission is not enabled from this prototype.')}<div class="auto-layout"><div class="auto-main"><section class="auto-hero"><div><div class="auto-status-line"><i></i>Unavailable · no auto-submit control is exposed</div><h2>Review every workflow before an employer is contacted.</h2><p>The documented API can accept a review workflow. It does not expose consent management, submission-rule settings, or a browser control to authorize automatic submission.</p></div><div class="auto-icon">${icon('shield')}</div></section><section class="alt-card" style="margin-top:0"><h2>Application safeguards</h2><div class="auto-safe"><div class="auto-safe-row">${icon('shield')}Stored consent and required evidence are checked before submission is queued.</div><div class="auto-safe-row">${icon('shield')}An ambiguous employer response is not blindly retried.</div><div class="auto-safe-row">${icon('shield')}A OneRole 202 response means workflow acceptance, not employer confirmation.</div></div></section></div></div>`;
    }

    function render() {
      updateIdentity();
      document.getElementById('crumb-current').textContent = activeView;
      document.querySelectorAll('.nav-link, .mobile-nav button').forEach(button => button.classList.toggle('active', button.dataset.view === activeView));
      const content = document.querySelector('.content');
      if (viewsWithSearch.has(activeView)) {
        content.innerHTML = discoveryPage();
        content.querySelector('.search-panel')?.insertAdjacentHTML('afterend', filterPanelHTML());
      }
      else if (activeView === 'My Applications') content.innerHTML = applicationsPage();
      else if (activeView === 'Auto-apply') content.innerHTML = autoApplyPage();
      else if (activeView === 'Settings') content.innerHTML = settingsPage();
      else {
        const details = {
          Overview: 'A personalized overview needs account and application-list endpoints.',
          'Saved Jobs': 'Saved-job storage and listing routes are not in the documented API.',
          'Recommended for You': 'Recommendations need profile and ranking endpoints.',
          'Resume & Profile': 'Profile and resume management routes are not in the documented API.',
          'Job Alerts': 'Alert preferences and delivery routes are not in the documented API.'
        };
        content.innerHTML = unavailablePage(activeView, details[activeView] || 'This view has no API-backed data yet.');
      }
      bindEvents();
    }

    function navigateTo(view) {
      activeView = view;
      activeTab = 'For you';
      mobileDetail = false;
      render();
      if (viewsWithSearch.has(activeView)) loadJobs();
      if (activeView === 'My Applications') refreshApplicationStatuses();
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function bindShellEvents() {
      document.querySelectorAll('.sidebar .nav-link, .mobile-nav button').forEach(button => button.addEventListener('click', () => navigateTo(button.dataset.view)));
      document.getElementById('global-search')?.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        searchTerm = event.target.value;
        navigateTo('Discover Jobs');
      });
      document.getElementById('session-action')?.addEventListener('click', () => accessToken ? signOut() : toast('Sign in with an enabled provider to continue.'));
      document.getElementById('tenant-select')?.addEventListener('change', event => {
        selectedTenantID = event.target.value;
        storeTenantSelection(selectedTenantID);
        render();
        if (activeView === 'My Applications') refreshApplicationStatuses();
      });
    }

    function bindEvents() {
      document.querySelector('.content')?.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => navigateTo(button.dataset.view)));
      document.getElementById('filter-button')?.addEventListener('click', () => {
        filtersOpen = !filtersOpen;
        if (filtersOpen) {
          filterDraft = cloneFilters(appliedFilters);
          facetLoadError = '';
          companySuggestions = {include: [], exclude: []};
          locationSuggestions = [];
          render();
          loadFilterMetadata();
        } else {
          render();
        }
      });
      document.getElementById('close-filters')?.addEventListener('click', () => { filtersOpen = false; render(); });
      document.getElementById('refresh-filter-counts')?.addEventListener('click', refreshDraftFacets);
      document.getElementById('apply-filters')?.addEventListener('click', () => {
        readFilterDraftFromDOM();
        appliedFilters = cloneFilters(filterDraft);
        filtersOpen = false;
        render();
        loadJobs();
      });
      document.getElementById('clear-filters')?.addEventListener('click', () => {
        appliedFilters = emptyFilters();
        filterDraft = emptyFilters();
        searchTerm = '';
        locationTerm = '';
        datePreset = 'any';
        sortOrder = 'relevance';
        filtersOpen = false;
        document.getElementById('global-search').value = '';
        render();
        loadJobs();
      });
      document.getElementById('filter-location-query')?.addEventListener('input', event => scheduleSuggestions('location', event.target.value));
      document.getElementById('company-include-query')?.addEventListener('input', event => scheduleSuggestions('include', event.target.value));
      document.getElementById('company-exclude-query')?.addEventListener('input', event => scheduleSuggestions('exclude', event.target.value));
      document.getElementById('filter-panel')?.addEventListener('input', () => readFilterDraftFromDOM());
      document.getElementById('filter-panel')?.addEventListener('change', () => readFilterDraftFromDOM());
      document.querySelectorAll('[data-remove-location]').forEach(button => button.addEventListener('click', () => {
        readFilterDraftFromDOM();
        filterDraft.locations.splice(Number(button.dataset.removeLocation), 1);
        render();
      }));
      document.querySelectorAll('[data-remove-company]').forEach(button => button.addEventListener('click', () => {
        readFilterDraftFromDOM();
        const property = button.dataset.removeCompany === 'include' ? 'companies' : 'excludedCompanies';
        filterDraft[property].splice(Number(button.dataset.index), 1);
        render();
      }));
      bindSuggestionEvents();
      document.querySelectorAll('.job-card').forEach(card => {
        const select = () => {
          selectedJob = jobs.find(job => job.id === card.dataset.job) || null;
          mobileDetail = true;
          render();
        };
        card.addEventListener('click', event => { if (!event.target.closest('button,a')) select(); });
        card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(); } });
      });
      document.getElementById('role-query')?.addEventListener('input', event => { searchTerm = event.target.value; });
      document.getElementById('location-query')?.addEventListener('input', event => { locationTerm = event.target.value; });
      document.getElementById('search-submit')?.addEventListener('click', () => {
        searchTerm = document.getElementById('role-query')?.value || '';
        locationTerm = document.getElementById('location-query')?.value || '';
        activeView = 'Discover Jobs';
        render();
        loadJobs();
      });
      document.getElementById('date-window')?.addEventListener('change', event => { datePreset = event.target.value; loadJobs(); });
      document.getElementById('sort-button')?.addEventListener('click', () => {
        const order = ['relevance', 'published_desc', 'first_seen_desc', 'salary_desc'];
        sortOrder = order[(order.indexOf(sortOrder) + 1) % order.length];
        loadJobs();
      });
      document.getElementById('refresh-applications')?.addEventListener('click', refreshApplicationStatuses);
      document.getElementById('mobile-close')?.addEventListener('click', () => { mobileDetail = false; render(); });
      document.querySelectorAll('[data-apply]').forEach(button => button.addEventListener('click', event => {
        event.stopPropagation();
        createApplication(button.dataset.apply);
      }));
    }

    async function signOut() {
      const csrf = csrfToken || readCookie('onerole_csrf');
      try {
        if (accessToken && csrf) await apiRequest('/auth/logout', {method: 'POST', headers: {'X-CSRF-Token': csrf}, retry: false});
      } catch (error) {
        toast(error.message);
      } finally {
        accessToken = '';
        csrfToken = '';
        currentUser = null;
        selectedTenantID = '';
        applications = [];
        storeTenantSelection('');
        jobs = [];
        selectedJob = null;
        await loadProviders();
        render();
      }
    }

    async function initialize() {
      await loadProviders();
      try {
        await refreshAccessToken();
        currentUser = await apiRequest('/auth/me', {retry: false});
        chooseTenant(Array.isArray(currentUser?.memberships) ? currentUser.memberships : []);
        apiError = '';
      } catch (error) {
        accessToken = '';
        currentUser = null;
        selectedTenantID = '';
        if (error.status && error.status !== 401) apiError = error.message;
      }
      render();
      if (accessToken) loadJobs();
    }

    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        document.getElementById('global-search')?.focus();
      }
      if (event.key === 'Escape' && mobileDetail) { mobileDetail = false; render(); }
    });
    bindShellEvents();
    render();
    initialize();
  </script>
</body>
</html>
