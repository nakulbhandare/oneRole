openapi: 3.1.0
info:
  title: OneRole API
  version: 0.1.0
  description: >-
    Design draft for OneRole's tenant-scoped job discovery and application workflow API.
    A 202 response means workflow acceptance by OneRole, not employer submission confirmation.
servers:
  - url: /api/v1
    description: Current host API
  - url: http://localhost:8088/api/v1
    description: Local development (:8088)
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Health
  - name: Jobs
  - name: Companies
  - name: Locations
  - name: Applications
  - name: Batches
paths:
  /healthz:
    get:
      tags: [Health]
      security: []
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [Health]
      security: []
      summary: Readiness including required dependencies
      responses:
        '200':
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: One or more required dependencies are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/providers:
    get:
      tags: [Authentication]
      security: []
      summary: List enabled sign-in providers
      responses:
        '200':
          description: Login buttons available in this OneRole deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /auth/dev-login:
    post:
      tags: [Authentication]
      security: []
      summary: Instant 1-click login for local development and testing
      description: >-
        Authenticates immediately as the requested email (defaults to onerole@gmail.com),
        ensures an active tenant and membership exists, and returns a signed access JWT
        plus session cookies. Only available outside production environments.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: onerole@gmail.com
                name:
                  type: string
                  example: OneRole Candidate
            example:
              email: onerole@gmail.com
              name: OneRole Candidate
      responses:
        '200':
          description: Session established and JWT access token minted
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, user_id, email, tenant_id]
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImxvY2FsLTEifQ...
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 600
                  user_id:
                    type: string
                    format: uuid
                    example: 22222222-2222-4222-8222-222222222222
                  email:
                    type: string
                    example: onerole@gmail.com
                  display_name:
                    type: string
                    example: OneRole Candidate
                  tenant_id:
                    type: string
                    format: uuid
                    example: 00000000-0000-4000-8000-000000000001
                  csrf_token:
                    type: string
                    example: v1.8j7z...
        '403':
          description: Dev login is disabled in production
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/csrf:
    get:
      tags: [Authentication]
      security: []
      summary: Bootstrap the CSRF token for an allowed browser origin
      description: >-
        Requires a valid signed onerole_csrf cookie and an exact configured Origin.
        Same-site subdomain frontends may call this endpoint with credentials to
        receive the token for X-CSRF-Token. Different registrable domains are not
        supported because the cookie uses SameSite=Strict.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFBootstrapCookie'
      responses:
        '200':
          description: Signed double-submit token for the configured browser origin
          headers:
            Cache-Control:
              description: Response is never cached
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CSRFBootstrap' }
        '403':
          description: Origin or CSRF cookie is missing, invalid, or not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/oauth/{provider}/start:
    get:
      tags: [Authentication]
      security: []
      summary: Start Google or GitHub authorization-code sign-in
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: Redirect to the selected identity provider
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/oauth/{provider}/callback:
    get:
      tags: [Authentication]
      security: []
      summary: Complete the provider callback and establish a OneRole session
      description: >-
        Consumes the one-time state and code, validates provider identity, sets a
        rotating HttpOnly refresh cookie scoped to /api/v1/auth and a signed,
        JavaScript-readable CSRF cookie scoped to /, clears the browser-binding
        cookie, and redirects only to a configured frontend route.
        Provider access tokens are never returned to the browser.
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        '302':
          description: Redirects to the fixed frontend callback route; sets the refresh and CSRF cookies
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Authentication]
      security:
        - refreshCookie: []
      summary: Rotate the refresh credential and mint a short-lived OneRole JWT
      description: Requires the HttpOnly refresh cookie and CSRF/origin validation. The frontend reads the signed CSRF cookie (Path=/) and sends its value in X-CSRF-Token. The old refresh token is invalidated.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: New short-lived access token; refresh cookie is rotated
          headers:
            Set-Cookie:
              description: Rotated Secure, HttpOnly, SameSite refresh cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Origin or CSRF token validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the active OneRole session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked and refresh cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Origin or CSRF token validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated OneRole identity and active tenant memberships
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /companies/search:
    get:
      tags: [Companies]
      summary: Search canonical employers for the Companies filter
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Canonical company suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /locations/suggest:
    get:
      tags: [Locations]
      summary: Suggest normalized locations for the Location filter
      parameters:
        - $ref: '#/components/parameters/LocationQuery'
        - name: country_code
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Location suggestions with matching job counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSuggestions'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs:
    get:
      tags: [Jobs]
      summary: Search jobs with basic filters
      parameters:
        - $ref: '#/components/parameters/JobIDFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/DatePreset'
        - $ref: '#/components/parameters/Workplace'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching jobs and cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/search:
    get:
      tags: [Jobs]
      summary: Search with linkable query-string filters
      description: Repeated query parameters are multi-select. For the full structured filter body, use POST.
      parameters:
        - $ref: '#/components/parameters/JobIDFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/ExcludeTerm'
        - $ref: '#/components/parameters/DatePreset'
        - $ref: '#/components/parameters/PublishedAfter'
        - $ref: '#/components/parameters/PublishedBefore'
        - $ref: '#/components/parameters/FirstSeenAfter'
        - $ref: '#/components/parameters/IncludeUnknownPublicationTime'
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/RadiusKM'
        - $ref: '#/components/parameters/IncludeUnknownLocation'
        - $ref: '#/components/parameters/Workplace'
        - $ref: '#/components/parameters/IncludeUnknownWorkplace'
        - $ref: '#/components/parameters/CompanyID'
        - $ref: '#/components/parameters/ExcludedCompanyID'
        - $ref: '#/components/parameters/IncludeUnknownCompany'
        - $ref: '#/components/parameters/DegreeLevel'
        - $ref: '#/components/parameters/IncludeUnknownDegree'
        - $ref: '#/components/parameters/DegreeRequirement'
        - $ref: '#/components/parameters/MaxExperienceYears'
        - $ref: '#/components/parameters/IncludeUnknownExperience'
        - $ref: '#/components/parameters/VisaSponsorship'
        - $ref: '#/components/parameters/RoleID'
        - $ref: '#/components/parameters/IncludeUnknownRoles'
        - $ref: '#/components/parameters/JobType'
        - $ref: '#/components/parameters/IncludeUnknownJobType'
        - $ref: '#/components/parameters/EmploymentType'
        - $ref: '#/components/parameters/IncludeUnknownEmploymentType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Matching jobs, applied filters, and facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Jobs]
      summary: Search with the complete structured filter set
      description: Read-only search used by the Apply filters action in the OneRole UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSearchRequest'
      responses:
        '200':
          description: Matching jobs, applied filters, facet counts, and cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/filters:
    get:
      tags: [Jobs]
      summary: Get supported filter choices and normalized facet values
      responses:
        '200':
          description: Filter vocabularies and data-quality counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Jobs]
      summary: Get facet counts in the context of a draft search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSearchRequest'
      responses:
        '200':
          description: Facet values and counts conditioned on the supplied search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/recommendations:
    get:
      tags: [Jobs]
      summary: Get AI/ATS-ranked job recommendations matching candidate resume and profile
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: min_score
          in: query
          required: false
          schema: { type: integer, default: 50, example: 70 }
          description: Minimum ATS match percentage filter (0-100)
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, example: 10 }
          description: Maximum number of recommendations to return
      responses:
        '200':
          description: Ranked list of recommended jobs with ATS match scores and skill alignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, example: 12 }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScoredJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/{jobID}:
    get:
      tags: [Jobs]
      summary: Get a normalized job and available application capabilities
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications:
    get:
      tags: [Applications]
      summary: List user's tenant-scoped applications
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  total:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Applications]
      summary: Start an application from the user's Apply action
      description: >-
        Persists application intent and queues preparation. Submission can be queued
        only after consent, evidence, completeness, and employer capability checks pass.
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplication'
      responses:
        '202':
          description: Workflow accepted by OneRole
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /applications/{applicationID}:
    get:
      tags: [Applications]
      summary: Get application state, capability, pause reason, and next action
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ApplicationID'
      responses:
        '200':
          description: Application state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationID}/submit:
    post:
      tags: [Applications]
      summary: Authorize submission of a ready application
      description: >-
        Creates a durable submission workflow only when the stored user consent is valid,
        required facts are resolved, and the employer adapter supports the flow.
        An ambiguous external response is never blindly retried.
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Submission workflow accepted, not yet employer-confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /application-batches:
    post:
      tags: [Batches]
      summary: Queue independent application workflows for a user-selected batch
      description: A batch is not an all-or-nothing transaction and does not guarantee employer acceptance.
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatch'
      responses:
        '202':
          description: Batch accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /application-batches/{batchID}:
    get:
      tags: [Batches]
      summary: Get batch progress and independent item counts
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: batchID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Batch state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationID}/timeline:
    get:
      tags: [Applications]
      summary: Read append-only application events and lifecycle outcomes
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ApplicationID'
      responses:
        '200':
          description: Event stream for the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTimeline'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationID}/receipt:
    get:
      tags: [Applications]
      summary: Read sanitized employer submission evidence or receipt
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ApplicationID'
      responses:
        '200':
          description: Submission receipt evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationID}/resume:
    get:
      tags: [Applications]
      summary: Download or view the exact vacancy-bound resume snapshot attached to this application
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ApplicationID'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [html, text, json]
            default: json
          description: Desired format (html for browser rendered serif PDF/HTML, text for ATS plain text, json for metadata)
      responses:
        '200':
          description: Vacancy-bound resume document or metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResumeView'
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/auto-apply:
    post:
      tags: [Applications]
      summary: 1-Click smart auto-apply using candidate profile and verified resume facts
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id: { type: string, example: "644150ef-1c41-41e5-b049-f4256bab80e7" }
                application_id: { type: string, example: "6b4bb05b-fbae-40d6-a763-dfd8a1913011" }
                resume_version_id: { type: string, example: "55555555-5555-4555-8555-555555555555" }
                tailor_resume: { type: boolean, default: true, description: "Whether to tailor resume experience to the job description while strictly preserving the visual layout. Set false to submit un-tailored master resume." }
      responses:
        '200':
          description: Application submitted with verified receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApplyResult'
  /applications/auto-apply/batch:
    post:
      tags: [Applications]
      summary: High-throughput batch 1-click smart auto-apply
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_ids]
              properties:
                job_ids:
                  type: array
                  items: { type: string }
                  example: ["644150ef-1c41-41e5-b049-f4256bab80e7", "f5da1e10-136e-42b9-85cf-e830f45f381b"]
                resume_version_id: { type: string, example: "55555555-5555-4555-8555-555555555555" }
                tailor_resume: { type: boolean, default: true, description: "Whether to tailor resume experience to each job description while preserving the visual layout." }
      responses:
        '200':
          description: Batch submission results and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApplyBatchResult'
  /profile:
    get:
      tags: [Profile]
      summary: Get candidate profile evidence and verified facts
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Current candidate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
    patch:
      tags: [Profile]
      summary: Update candidate profile evidence and factual answers
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, example: "Jane" }
                last_name: { type: string, example: "Doe" }
                phone: { type: string, example: "555-019-2834" }
                years_of_experience: { type: integer, example: 7 }
                desired_salary_min: { type: integer, example: 150000 }
                open_to_remote: { type: boolean, example: true }
      responses:
        '200':
          description: Updated candidate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
    put:
      tags: [Profile]
      summary: Replace or update candidate profile evidence
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfile'
      responses:
        '200':
          description: Updated candidate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
  /jobs/recent:
    get:
      tags: [Jobs]
      summary: Sort jobs by recent publication or discovery time
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        '200':
          description: List of recent jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Job' } }
                  next_cursor: { type: string, nullable: true }
  /sources:
    get:
      tags: [Sources]
      summary: List registered job ingestion sources and capabilities
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: List of company job sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SourceSummary' }
