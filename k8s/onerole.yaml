apiVersion: v1
kind: Namespace
metadata:
  name: onerole
---
apiVersion: v1
kind: Secret
metadata:
  name: onerole-secrets
  namespace: onerole
type: Opaque
data:
  private.pem: 
  public.pem: 
stringData:
  AUTH_ENCRYPTION_KEY: "siT1udCns6L8Aydi94Ikb0ZcmCDOACboLgAt1SLNDOQ="
  CSRF_SIGNING_SECRET: "12345678901234567890123456789012"
  IDEMPOTENCY_HMAC_SECRET: "ABCDEFGHIJABCDEFGHIJABCDEFGHIJAB"
---
# ----------------------------------------------------------------------------
# MongoDB Database (with persistent Azure disk)
# ----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: onerole
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: onerole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5", "--maxConns", "200"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: onerole
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
# ----------------------------------------------------------------------------
# NATS JetStream Message Broker
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: onerole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: onerole
spec:
  ports:
    - port: 4222
      name: client
      targetPort: 4222
    - port: 8222
      name: monitor
      targetPort: 8222
  selector:
    app: nats
---
# ----------------------------------------------------------------------------
# OneRole Backend API Microservice
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-api
  namespace: onerole
  labels:
    app: onerole-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onerole-api
  template:
    metadata:
      labels:
        app: onerole-api
    spec:
      containers:
        - name: api
          image: oneroleacr.azurecr.io/onerole-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: PORT
              value: "8088"
            - name: HTTP_ADDR
              value: ":8088"
            - name: DATABASE_URL
              value: "mongodb://mongodb:27017/onerole"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: APP_MODE
              value: "all"
            - name: APP_ENV
              value: "development"
            - name: COOKIE_SECURE
              value: "false"
            - name: JWT_SIGNING_PRIVATE_KEY_FILE
              value: "/app/secrets/private.pem"
            - name: JWT_SIGNING_PUBLIC_KEY_FILE
              value: "/app/secrets/public.pem"
            - name: AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: onerole-secrets
                  key: AUTH_ENCRYPTION_KEY
            - name: CSRF_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: onerole-secrets
                  key: CSRF_SIGNING_SECRET
            - name: IDEMPOTENCY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: onerole-secrets
                  key: IDEMPOTENCY_HMAC_SECRET
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: onerole-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: onerole-api
  namespace: onerole
spec:
  ports:
    - port: 8088
      targetPort: 8088
      name: http
  selector:
    app: onerole-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: onerole-api-hpa
  namespace: onerole
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onerole-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# ----------------------------------------------------------------------------
# OneRole Frontend UI Microservice
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-ui
  namespace: onerole
  labels:
    app: onerole-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onerole-ui
  template:
    metadata:
      labels:
        app: onerole-ui
    spec:
      containers:
        - name: ui
          image: oneroleacr.azurecr.io/onerole-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_URL
              value: "http://onerole-api:8088"
            - name: NATS_MONITOR_URL
              value: "http://nats:8222"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: onerole-ui-hpa
  namespace: onerole
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onerole-ui
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# ----------------------------------------------------------------------------
# OneRole Frontend UI Service (ClusterIP behind Ingress)
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: onerole-ui
  namespace: onerole
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: onerole-ui
---
# ----------------------------------------------------------------------------
# Let's Encrypt Production ClusterIssuer
# ----------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: n_bhandare@u.pacific.edu
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
# ----------------------------------------------------------------------------
# Ingress with Automatic HTTPS (TLS) via cert-manager & Let's Encrypt
# ----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onerole-ingress
  namespace: onerole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - onerole-portal.swedencentral.cloudapp.azure.com
      secretName: onerole-tls
  rules:
    - host: onerole-portal.swedencentral.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onerole-ui
                port:
                  number: 8082
