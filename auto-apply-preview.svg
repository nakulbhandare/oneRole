  <g class="sans" font-size="10" fill="#56645b"><circle cx="1070" cy="314" r="7" fill="#eaf3ed"/><path d="m1067 314 2 2 4-5" fill="none" stroke="#57906a" stroke-width="1.2"/><text x="1086" y="318">Use reviewed profile facts only</text><circle cx="1070" cy="346" r="7" fill="#eaf3ed"/><path d="m1067 346 2 2 4-5" fill="none" stroke="#57906a" stroke-width="1.2"/><text x="1086" y="350">Queue missing answers for that listing</text><circle cx="1070" cy="378" r="7" fill="#eaf3ed"/><path d="m1067 378 2 2 4-5" fill="none" stroke="#57906a" stroke-width="1.2"/><text x="1086" y="382">Review sensitive or legal questions</text><circle cx="1070" cy="410" r="7" fill="#eaf3ed"/><path d="m1067 410 2 2 4-5" fill="none" stroke="#57906a" stroke-width="1.2"/><text x="1086" y="414">Continue with other eligible jobs</text><circle cx="1070" cy="442" r="7" fill="#eaf3ed"/><path d="m1067 442 2 2 4-5" fill="none" stroke="#57906a" stroke-width="1.2"/><text x="1086" y="446">Respect limits; never bypass CAPTCHAs</text></g>
