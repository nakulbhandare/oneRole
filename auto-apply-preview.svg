  <text x="282" y="102" class="sans strong" font-size="10" letter-spacing="1.1" fill="#24684f">OPENROLE WORKSPACE</text><text x="282" y="136" class="sans strong ink" font-size="27" letter-spacing="-.7">Auto-apply</text><text x="282" y="159" class="sans muted" font-size="12">Set your boundaries once. Submit only to matching, supported applications.</text>
  <rect x="282" y="178" width="1130" height="37" rx="9" fill="#fbfaf3" stroke="#e6e5d9"/><circle cx="307" cy="196" r="6" fill="none" stroke="#a88b4b" stroke-width="1.1"/><path d="m303 196 3 3 6-7" fill="none" stroke="#a88b4b" stroke-width="1.2"/><text x="322" y="201" class="sans" font-size="10" fill="#746a48"><tspan font-weight="700" fill="#625a3f">Prototype preview</tspan><tspan dx="6">Profile and rules are illustrative. Nothing is submitted from this prototype.</tspan></text>
  <rect x="282" y="231" width="744" height="164" rx="14" fill="#fff" stroke="#e8ece9" filter="url(#shadow)"/><circle cx="306" cy="258" r="4" fill="#c8a766"/><text x="318" y="262" class="sans strong" font-size="10" fill="#79847d">OFF · REQUIRES YOUR OPT-IN</text><text x="306" y="297" class="sans strong" font-size="20" letter-spacing="-.4" fill="#1d2825">Keep applying to eligible jobs</text><text x="306" y="322" class="sans strong" font-size="20" letter-spacing="-.4" fill="#1d2825">as they appear.</text><text x="306" y="347" class="sans" font-size="11" fill="#78827e">Submit once per matching listing, then monitor until the employer</text><text x="306" y="363" class="sans" font-size="11" fill="#78827e">removes it or closes it. One blocked job won't stop other matches.</text><rect x="306" y="372" width="32" height="18" rx="9" fill="#dfe6e1"/><circle cx="315" cy="381" r="7" fill="#fff" stroke="#e8ece9"/><text x="346" y="385" class="sans strong" font-size="10" fill="#516057">Enable continuous auto-apply</text>
