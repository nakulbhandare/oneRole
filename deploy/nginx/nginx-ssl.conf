events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Upstreams pointing to host network
    upstream ui_upstream {
        server host.docker.internal:8082;
        keepalive 32;
    }

    upstream api_upstream {
        server host.docker.internal:8088;
        keepalive 32;
    }

    # HTTP Server -> Redirects to HTTPS
    server {
        listen 80;
        server_name onerole.com www.onerole.com localhost;

        location /healthz {
            return 200 '{"status":"healthy","protocol":"http"}\n';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Enterprise HTTPS Server (TLS 1.2 & 1.3)
    server {
        listen 443 ssl;
        http2 on;
        server_name onerole.com www.onerole.com localhost;

        ssl_certificate /etc/nginx/certs/onerole.crt;
        ssl_certificate_key /etc/nginx/certs/onerole.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        # 1. API Microservice Routes
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            proxy_buffering off;
        }

        # 2. Swagger Documentation
        location ~ ^/(docs|swagger) {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Healthcheck
        location /healthz {
            return 200 '{"status":"healthy","domain":"onerole.com","protocol":"https","ssl":true}\n';
            add_header Content-Type application/json;
        }

        # 4. Frontend React Modular UI
        location / {
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
