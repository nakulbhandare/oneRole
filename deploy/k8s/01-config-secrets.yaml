apiVersion: v1
kind: ConfigMap
metadata:
  name: onerole-config
  namespace: onerole
data:
  APP_ENV: "development"
  APP_MODE: "api"
  HTTP_ADDR: ":8088"
  PORT: "8088"
  UI_PORT: "8082"
  DATABASE_URL: "mongodb://mongodb-svc.onerole.svc.cluster.local:27017/onerole"
  ELASTICSEARCH_URL: "http://elasticsearch-svc.onerole.svc.cluster.local:9200"
  NATS_URL: "nats://nats-svc.onerole.svc.cluster.local:4222"
  NATS_MONITOR_URL: "http://nats:8222"
  BACKEND_URL: "http://onerole-api:8088"
  CONCURRENCY: "4"
  DOMAIN: "onerole.com"
  JWT_ISSUER: "http://onerole-api:8088"
  JWT_AUDIENCE: "onerole-web"
  JWT_SIGNING_KEY_ID: "local-1"
  JWT_SIGNING_PRIVATE_KEY_FILE: "/etc/onerole/keys/jwt-signing.pem"
  COOKIE_SECURE: "false"
  ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:8088,http://localhost:8082,https://onerole.com,https://www.onerole.com,https://localhost,https://onerole.com:8443,https://localhost:8443"
---
apiVersion: v1
kind: Secret
metadata:
  name: onerole-secrets
  namespace: onerole
type: Opaque
stringData:
  AUTH_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  CSRF_SIGNING_SECRET: "local-only-insecure-csrf-secret-change-this-value"
  IDEMPOTENCY_HMAC_SECRET: "local-only-insecure-idempotency-secret-change-this"
  JWT_SECRET: "onerole-enterprise-jwt-production-secret-key-2026"
---
