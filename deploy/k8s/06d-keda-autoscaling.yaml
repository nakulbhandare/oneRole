apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-onerole-worker-api
  namespace: onerole
spec:
  scaleTargetRef:
    name: onerole-worker-api
  minReplicaCount: 3
  maxReplicaCount: 30
  cooldownPeriod: 30
  pollingInterval: 5
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: "nats.onerole.svc.cluster.local:8222"
      account: "$G"
      stream: "APPLICATIONS"
      consumer: "application-submit-api-v1"
      lagThreshold: "25"
---
