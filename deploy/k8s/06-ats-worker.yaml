apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-worker
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-worker
    app.kubernetes.io/part-of: onerole-platform
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: onerole-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onerole-worker
        app.kubernetes.io/part-of: onerole-platform
    spec:
      containers:
      - name: worker
        image: onerole-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: health
        env:
        - name: PORT
          value: "3001"
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: onerole-config
              key: DATABASE_URL
        - name: CONCURRENCY
          value: "10"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
