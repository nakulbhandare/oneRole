apiVersion: v1
kind: Service
metadata:
  name: onerole-ui
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-ui
    app.kubernetes.io/part-of: onerole-platform
spec:
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  selector:
    app.kubernetes.io/name: onerole-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-ui
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-ui
    app.kubernetes.io/part-of: onerole-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onerole-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onerole-ui
        app.kubernetes.io/part-of: onerole-platform
    spec:
      containers:
      - name: ui
        image: onerole-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: PORT
          value: "8082"
        - name: BACKEND_URL
          value: "http://onerole-api:8088"
        - name: NATS_MONITOR_URL
          value: "http://nats:8222"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 15
