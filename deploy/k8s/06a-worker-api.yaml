apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-worker-api
  namespace: onerole
  labels:
    app: onerole-worker-api
    app.kubernetes.io/name: onerole-worker-api
    app.kubernetes.io/part-of: onerole-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: onerole-worker-api
  template:
    metadata:
      labels:
        app: onerole-worker-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: api-worker
        image: oneroleacr.azurecr.io/onerole-api:latest
        imagePullPolicy: Always
        command: ["/app/server"]
        args: ["--mode=worker-api"]
        ports:
        - containerPort: 8089
          name: health
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: DATABASE_URL
          value: "mongodb://mongodb:27017/onerole"
        - name: CONSUMER_NAME
          value: "application-submit-api-v1"
        - name: CONCURRENCY
          value: "50"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: onerole-worker-api-hpa
  namespace: onerole
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onerole-worker-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
