apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-worker-browser
  namespace: onerole
  labels:
    app: onerole-worker-browser
    app.kubernetes.io/name: onerole-worker-browser
    app.kubernetes.io/part-of: onerole-platform
spec:
  replicas: 4
  selector:
    matchLabels:
      app: onerole-worker-browser
  template:
    metadata:
      labels:
        app: onerole-worker-browser
    spec:
      terminationGracePeriodSeconds: 45
      containers:
      - name: browser-worker
        image: oneroleacr.azurecr.io/onerole-worker-chromium:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: health
        env:
        - name: PORT
          value: "3001"
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: DATABASE_URL
          value: "mongodb://mongodb:27017/onerole"
        - name: STREAM_NAME
          value: "APPLICATIONS"
        - name: CONSUMER_NAME
          value: "application-submit-browser-v1"
        - name: CONCURRENCY
          value: "3"
        - name: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
          value: "/usr/bin/chromium"
        - name: RESUME_FILE_PATH
          value: "/app/Nakul_Bhandare_Resume.pdf"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            cpu: 500m
            memory: 1024Mi
          limits:
            cpu: 2000m
            memory: 3072Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 25
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: onerole-worker-browser-hpa
  namespace: onerole
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onerole-worker-browser
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
