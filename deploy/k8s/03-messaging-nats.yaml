apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: onerole
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: onerole-platform
spec:
  ports:
  - port: 4222
    targetPort: 4222
    name: client
  - port: 8222
    targetPort: 8222
    name: monitor
  selector:
    app.kubernetes.io/name: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: onerole
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: onerole-platform
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: onerole-platform
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        command:
        - "nats-server"
        - "--jetstream"
        - "--store_dir=/data"
        - "-m"
        - "8222"
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitor
        volumeMounts:
        - name: nats-storage
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: nats-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
