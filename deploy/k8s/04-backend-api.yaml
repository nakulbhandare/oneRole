apiVersion: v1
kind: Service
metadata:
  name: onerole-api
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-api
    app.kubernetes.io/part-of: onerole-platform
spec:
  ports:
  - port: 8088
    targetPort: 8088
    name: http
  selector:
    app.kubernetes.io/name: onerole-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-api
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-api
    app.kubernetes.io/part-of: onerole-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onerole-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onerole-api
        app.kubernetes.io/part-of: onerole-platform
    spec:
      containers:
      - name: api
        image: onerole-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
          name: http
        envFrom:
        - configMapRef:
            name: onerole-config
        - secretRef:
            name: onerole-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: jwt-key
          mountPath: /etc/onerole/keys
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/v1/healthz
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /api/v1/healthz
            port: 8088
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
      volumes:
      - name: jwt-key
        secret:
          secretName: onerole-jwt-key
