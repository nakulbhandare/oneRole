# ============================================================================
# OneRole Enterprise NGINX Reverse Proxy Configuration (TLS & Routing)
# Dedicated reverse proxy routing onerole.com across all microservices
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: onerole-nginx-conf
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-nginx
    app.kubernetes.io/part-of: onerole-platform
data:
  default.conf: |
    # Upstream Microservice Definitions
    upstream ui_backend {
        server onerole-ui:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream api_backend {
        server onerole-api:8088 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream nats_monitor {
        server nats:8222 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Enterprise Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # 1. HTTP Server -> Redirects to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name onerole.com www.onerole.com localhost;

        location /healthz {
            return 200 '{"status":"healthy","protocol":"http","cluster":"kubernetes-kind"}\n';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Enterprise HTTPS Server (TLS 1.2 & 1.3)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name onerole.com www.onerole.com localhost;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 50M;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

        # 1. API Microservice Routes
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            proxy_buffering off;
        }

        # 2. API Documentation & Swagger UI
        location ~ ^/(docs|swagger) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. NATS JetStream Telemetry Monitor
        location /telemetry/nats {
            proxy_pass http://nats_monitor/jsz?streams=true&consumers=true;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 4. Global Healthcheck Endpoint
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","domain":"onerole.com","cluster":"kubernetes-kind","ssl":true}\n';
            add_header Content-Type application/json;
        }

        # 5. Frontend React Modular UI Microservice (Root & SPA Fallback)
        location / {
            proxy_pass http://ui_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket upgrade for live reactive events
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: onerole-nginx
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-nginx
    app.kubernetes.io/part-of: onerole-platform
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
  - port: 443
    targetPort: 443
    nodePort: 30443
    name: https
  selector:
    app.kubernetes.io/name: onerole-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerole-nginx
  namespace: onerole
  labels:
    app.kubernetes.io/name: onerole-nginx
    app.kubernetes.io/part-of: onerole-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onerole-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onerole-nginx
        app.kubernetes.io/part-of: onerole-platform
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-conf
        configMap:
          name: onerole-nginx-conf
      - name: tls-certs
        secret:
          secretName: onerole-tls
