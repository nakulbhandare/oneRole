# ============================================================================
# OneRole Enterprise Kubernetes in Docker (kind) Cluster Configuration
# Maps host ports 443 and 8443 directly to Kubernetes NodePort services
# ============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: onerole-cluster
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30443
    hostPort: 443
    protocol: TCP
  - containerPort: 30443
    hostPort: 8443
    protocol: TCP
  - containerPort: 30080
    hostPort: 8085
    protocol: TCP
