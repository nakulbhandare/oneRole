apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: onerole
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: onerole-platform
spec:
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: onerole
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: onerole-platform
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: onerole-platform
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 3Gi
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 20
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 20
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata:
      name: mongo-storage
    spec:
      storageClassName: managed-premium
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
